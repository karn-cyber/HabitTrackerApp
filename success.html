    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #ffffff;
            --text-main: #1f2937;
            --font-main: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        p {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .success-container {
            padding: 2rem;
            max-width: 500px;
            background-color: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .success-container h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        .success-container p {
            color: #6b7280;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .download-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .back-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #4f46e5;
        }
    </style>
</head>

<body>
    <div class="success-container">
        <div class="success-icon">🎉</div>
        <h1>Payment Successful!</h1>
        <p>Thank you for your purchase. Click the buttons below to create your personal copies in Google Drive.</p>

        <div id="download-section" class="download-buttons">
            <!-- Buttons injected via JS -->
        </div>

        <a href="/" class="back-link">Return to Home</a>
    </div>

        // Valid proofs:
        // 1. URL param 'auth=verified' (New purchase)
        // 2. sessionStorage 'secure_access_token' (Session fallback)
        // 3. localStorage 'ownedProducts' (Returning customer)

        const urlParams = new URLSearchParams(window.location.search);
        const hasAuthToken = urlParams.get('auth') === 'verified';
        const hasSessionToken = sessionStorage.getItem('secure_access_token');
        const hasOwnership = localStorage.getItem('ownedProducts'); // Check if they own anything

            window.location.href = '/';

        };

        function createButton(key) {
            const data = links[key];
            if (!data) return;
            const btn = document.createElement('a');
            btn.href = data.url;
            btn.className = 'download-btn';
            btn.target = '_blank';
            btn.textContent = data.text;
            container.appendChild(btn);
        }

        if (product === 'bundle') {
            createButton('finance');
            createButton('habit');
        } else if (product && links[product]) {
            createButton(product);
        } else {
            // Fallback or default
            createButton('habit');
        }

</body>
